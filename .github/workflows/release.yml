name: Release preview

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: ./scripts/release/build-macos.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - shell: pwsh
        run: ./scripts/release/build-windows.ps1 -Runtime "${{ matrix.runtime }}" -Tag "$env:GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.runtime }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: ./scripts/release/verify-assets.sh dist
      - name: Publish unsigned preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Codex Pet HUD preview

          Download the archive for your platform and verify it with `SHA256SUMS.txt`.

          > [!WARNING]
          > These preview builds are not Developer ID notarized or Authenticode signed. macOS Gatekeeper or Windows SmartScreen may display an unknown-developer warning. Download only from this official repository.

          The live usage integration reads the existing Codex access token in memory and calls an undocumented internal endpoint. Tokens, logs, and Codex data are never included in release assets.

          See the [changelog](https://github.com/himomohi/codex-pet-hud/blob/main/CHANGELOG.md) and [project website](https://himomohi.github.io/codex-pet-hud/).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --prerelease \
            --title "Codex Pet HUD $GITHUB_REF_NAME · Unsigned Preview" \
            --notes-file release-notes.md
